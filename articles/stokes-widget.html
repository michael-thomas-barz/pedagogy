<div id="hp-airy-stokes-leading">
  <div class="hp-frame">
    <header class="hp-heading">
      <div>
        <h2>Airy Stokes diagram</h2>
        <p>Click or drag to move <i>z</i>.</p>
      </div>
      <div class="hp-equation" aria-label="Airy equation">Ai″(<i>z</i>) = <i>z</i> Ai(<i>z</i>)</div>
    </header>

    <div class="hp-layout">
      <section class="hp-plane" aria-label="Complex plane">
        <button type="button" class="hp-map cursor-interaction" aria-label="Select z on the complex plane. Use arrow keys to move, Shift for larger steps, or Home for the origin." data-map>
          <svg class="hp-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three Airy sectors. Solid lines mark the two Stokes jumps and the dashed negative real axis marks the branch cut."></svg>
        </button>
        <div class="hp-plane-readout">
          <span data-radius></span>
          <span data-angle></span>
        </div>
        <div class="hp-legend">
          <span><i class="hp-ray-jump"></i> Stokes jump</span>
          <span><i class="hp-ray-cut"></i> Branch cut</span>
        </div>
      </section>

      <section class="hp-comparison" aria-label="Airy values and leading approximations">
        <div class="hp-point" aria-live="polite" aria-atomic="true">
          <div class="hp-point-z"><i>z</i> <span data-z-value></span></div>
          <div class="hp-point-ai"><span>Ai(<i>z</i>)</span><span data-ai-value></span></div>
        </div>
        <div class="hp-table-top">
          <span data-region></span>
        </div>
        <table class="hp-table" aria-label="Comparison of three leading approximations">
          <thead><tr><th scope="col">Sector</th><th scope="col">Approximation</th><th scope="col">Value</th><th scope="col" title="Absolute error divided by the modulus of Ai(z)">Rel. error</th></tr></thead>
          <tbody></tbody>
        </table>
      </section>
    </div>
  </div>
</div>

<style>
#hp-airy-stokes-leading {
  --hp-bg: #282828;
  --hp-stage: #1d2021;
  --hp-fg: #ebdbb2;
  --hp-dim: #bdae93;
  --hp-border: #504945;
  --hp-gold: #fabd2f;
  --hp-axis: #928374;
  --hp-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  --hp-serif: Georgia, "Times New Roman", serif;
  color: var(--hp-fg);
  font: 13px/1.45 var(--hp-mono);
  color-scheme: dark;
  width: 100%;
}
#hp-airy-stokes-leading *, #hp-airy-stokes-leading *::before, #hp-airy-stokes-leading *::after { box-sizing: border-box; }
#hp-airy-stokes-leading .hp-frame {
  max-width: 850px;
  margin: 0 auto;
  padding: clamp(12px, 3vw, 24px);
  border: 1px solid var(--hp-border);
  border-radius: 15px;
  background: var(--hp-bg);
}
#hp-airy-stokes-leading .hp-heading {
  display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap;
  gap: 5px 14px; margin-bottom: 17px;
}
#hp-airy-stokes-leading .hp-heading h2 {
  margin: 0; color: var(--hp-fg); font: 400 clamp(25px, 4vw, 34px)/1.1 var(--hp-serif);
}
#hp-airy-stokes-leading .hp-heading p { margin: 6px 0 0; color: var(--hp-dim); font-size: 12px; }
#hp-airy-stokes-leading .hp-equation { color: var(--hp-dim); font: 400 17px/1.1 var(--hp-serif); }
#hp-airy-stokes-leading .hp-layout {
  display: grid; grid-template-columns: minmax(0, .94fr) minmax(0, 1.06fr);
  align-items: start; gap: 17px;
}
#hp-airy-stokes-leading .hp-plane, #hp-airy-stokes-leading .hp-comparison { min-width: 0; }
#hp-airy-stokes-leading .hp-map {
  display: block; width: 100%; padding: 0; aspect-ratio: 1;
  border: 1px solid var(--hp-border); border-radius: 10px;
  background: var(--hp-stage); color: var(--hp-fg); cursor: crosshair; touch-action: none;
}
#hp-airy-stokes-leading .hp-map:focus-visible { outline: 2px solid var(--hp-gold); outline-offset: 3px; }
#hp-airy-stokes-leading .hp-svg { display: block; width: 100%; height: 100%; }
#hp-airy-stokes-leading .hp-svg text { user-select: none; dominant-baseline: central; }
#hp-airy-stokes-leading .hp-plane-readout, #hp-airy-stokes-leading .hp-legend {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
  gap: 4px 15px; color: var(--hp-dim); font-size: 11px;
}
#hp-airy-stokes-leading .hp-plane-readout { min-height: 32px; color: var(--hp-fg); }
#hp-airy-stokes-leading .hp-legend i {
  display: inline-block; width: 14px; vertical-align: 3px; margin-right: 3px;
}
#hp-airy-stokes-leading .hp-ray-jump { border-top: 2px solid var(--hp-gold); }
#hp-airy-stokes-leading .hp-ray-cut { border-top: 1px dashed var(--hp-axis); }
#hp-airy-stokes-leading .hp-point {
  background: var(--hp-stage); border: 1px solid var(--hp-border);
  border-radius: 9px; padding: 10px 12px; overflow-wrap: anywhere;
}
#hp-airy-stokes-leading .hp-point-z { font-size: 12px; color: var(--hp-dim); }
#hp-airy-stokes-leading .hp-point-ai { display: flex; flex-wrap: wrap; gap: 1px 10px; align-items: baseline; }
#hp-airy-stokes-leading .hp-point-ai > :first-child { font: 400 23px var(--hp-serif); }
#hp-airy-stokes-leading .hp-point-ai > :last-child { color: var(--hp-gold); font-size: 14px; }
#hp-airy-stokes-leading .hp-table-top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 4px 8px; margin: 8px 0 2px; min-height: 36px; font-size: 11px;
}
#hp-airy-stokes-leading .hp-table-top > span { color: var(--hp-fg); }
#hp-airy-stokes-leading .hp-table {
  width: 100%; table-layout: auto; border-collapse: collapse;
  margin: 0; font: 11px/1.28 var(--hp-mono); color: var(--hp-fg);
}
#hp-airy-stokes-leading .hp-table :is(th, td) {
  border: 0; border-bottom: 1px solid var(--hp-border); padding: 6px 4px;
  text-align: left; vertical-align: middle; background: transparent;
}
#hp-airy-stokes-leading .hp-table thead th { color: var(--hp-dim); font-weight: 400; }
#hp-airy-stokes-leading .hp-table tr > :first-child { padding-left: 6px; }
#hp-airy-stokes-leading .hp-table tr > :last-child { text-align: right; padding-right: 5px; white-space: nowrap; }
#hp-airy-stokes-leading .hp-table tbody th { width: 13%; font-weight: 500; color: var(--sector); }
#hp-airy-stokes-leading .hp-table .hp-recipe { font: 400 15px/1.15 var(--hp-serif); white-space: nowrap; }
#hp-airy-stokes-leading .hp-table .hp-value { width: 49%; }
#hp-airy-stokes-leading .hp-value-part { display: inline-block; white-space: nowrap; }
#hp-airy-stokes-leading .hp-table .hp-current { background: var(--sector-wash); }
#hp-airy-stokes-leading .hp-table .hp-current > :first-child { box-shadow: inset 2px 0 var(--sector); }
#hp-airy-stokes-leading .hp-recipe sub { font-size: .73em; }
@media (max-width: 650px) {
  #hp-airy-stokes-leading .hp-layout { grid-template-columns: minmax(0, 1fr); gap: 13px; }
  #hp-airy-stokes-leading .hp-plane { width: min(100%, 385px); justify-self: center; }
  #hp-airy-stokes-leading .hp-plane-readout { min-height: 29px; }
}
@media (max-width: 370px) {
  #hp-airy-stokes-leading .hp-table :is(th, td) { padding-left: 2px; padding-right: 2px; }
  #hp-airy-stokes-leading .hp-point-ai > :last-child { font-size: 12px; }
}
#hp-airy-stokes-leading .hp-note { margin: 9px 0 0; color: var(--hp-dim); font-size: 11px; }
</style>
<script>
(() => {
function airyReference(re, im) {
  // The entire solution of y'' = zy has a_{n+3} = a_n / ((n+3)(n+2)).
  // Fixed-point arithmetic preserves the cancellation on the positive real side.
  const digits = 64;
  const scale = 10n ** BigInt(digits);
  const atZero = 3550280538878172392600631860041831763979791741991772405833265103n;
  const derivativeAtZero = -2588194037928067984051835601892039634790911383549345822100018138n;
  const zr = BigInt(re.toFixed(digits).replace('.', ''));
  const zi = BigInt(im.toFixed(digits).replace('.', ''));
  const cubeRe = zr * (zr * zr - 3n * zi * zi) / (scale * scale);
  const cubeIm = zi * (3n * zr * zr - zi * zi) / (scale * scale);

  let constantRe = atZero;
  let constantIm = 0n;
  let linearRe = derivativeAtZero * zr / scale;
  let linearIm = derivativeAtZero * zi / scale;
  let sumRe = 0n;
  let sumIm = 0n;

  // These are the z^{3k} and z^{3k+1} series. The z^{3k+2} series is zero.
  for (let n = 0n; constantRe || constantIm || linearRe || linearIm; n += 3n) {
    sumRe += constantRe + linearRe;
    sumIm += constantIm + linearIm;
    const constantDivisor = scale * (n + 3n) * (n + 2n);
    const linearDivisor = scale * (n + 4n) * (n + 3n);
    [constantRe, constantIm] = [
      (constantRe * cubeRe - constantIm * cubeIm) / constantDivisor,
      (constantRe * cubeIm + constantIm * cubeRe) / constantDivisor
    ];
    [linearRe, linearIm] = [
      (linearRe * cubeRe - linearIm * cubeIm) / linearDivisor,
      (linearRe * cubeIm + linearIm * cubeRe) / linearDivisor
    ];
  }
  return [Number(`${sumRe}e-${digits}`), Number(`${sumIm}e-${digits}`)];
}

const root = document.getElementById('hp-airy-stokes-leading');
const map = root.querySelector('[data-map]');
const svg = map.querySelector('.hp-svg');
const maximumRadius = 8;
const radians = Math.PI / 180;
const sectors = [
  { id: 'I',   start: -120, end:  120, color: '#8ec07c', multiplier:  0 },
  { id: 'II',  start:  120, end:  180, color: '#fe8019', multiplier:  1 },
  { id: 'III', start: -180, end: -120, color: '#d3869b', multiplier: -1 }
];

const readouts = {};
for (const name of ['z-value', 'ai-value', 'radius', 'angle', 'region']) {
  readouts[name] = root.querySelector('[data-' + name + ']');
}

const polar = (radius, phase) => [radius * Math.cos(phase), radius * Math.sin(phase)];

function leadingApproximation(radius, angle, multiplier) {
  const [real, imaginary] = polar((2 / 3) * radius ** 1.5, 1.5 * angle * radians);
  const amplitude = 1 / (2 * Math.sqrt(Math.PI) * radius ** .25);
  const phase = -angle * radians / 4;
  const minus = polar(amplitude * Math.exp(-real), phase - imaginary);
  const plus = polar(amplitude * Math.exp(real), phase + imaginary);
  return [minus[0] - multiplier * plus[1], minus[1] + multiplier * plus[0]];
}

function magnitudeText(value, digits = 5) {
  if (value === 0) return '0';
  if (!Number.isFinite(value)) return '∞';
  const text = value < .001 || value >= 100000
    ? value.toExponential(digits - 1)
    : String(Number(value.toPrecision(digits)));
  return text.replace(/(\.\d*?[1-9])0+e/, '$1e')
    .replace(/\.0+e/, 'e').replace('e+', 'e').replaceAll('-', '−');
}

function complexText(container, [real, imaginary], digits) {
  const realPart = document.createElement('span');
  realPart.className = 'hp-value-part';
  realPart.textContent = (real < 0 ? '−' : '') + magnitudeText(Math.abs(real), digits);
  if (imaginary === 0) {
    container.replaceChildren(realPart);
    return;
  }
  const imaginaryPart = document.createElement('span');
  imaginaryPart.className = 'hp-value-part';
  imaginaryPart.textContent = (imaginary < 0 ? '− ' : '+ ') + magnitudeText(Math.abs(imaginary), digits) + 'i';
  container.replaceChildren(realPart, document.createTextNode(' '), imaginaryPart);
}

function angleText(angle, digits = 0) {
  return angle.toFixed(digits).replace('-', '−') + '°';
}

const rows = sectors.map((sector) => {
  const tr = document.createElement('tr');
  tr.style.setProperty('--sector', sector.color);
  tr.style.setProperty('--sector-wash', sector.color + '1c');
  const name = document.createElement('th');
  name.scope = 'row';
  name.textContent = sector.id;
  name.title = angleText(sector.start) + ' to ' + angleText(sector.end);
  name.setAttribute('aria-label', 'Sector ' + sector.id + ', ' + name.title);
  const recipe = document.createElement('td');
  recipe.className = 'hp-recipe';
  recipe.innerHTML = '<i>E</i><sub>−</sub>' + ({
    1: ' + <i>iE</i><sub>+</sub>',
    '-1': ' − <i>iE</i><sub>+</sub>',
    0: ''
  })[sector.multiplier];
  const value = document.createElement('td');
  value.className = 'hp-value';
  const error = document.createElement('td');
  tr.append(name, recipe, value, error);
  root.querySelector('tbody').append(tr);
  return { tr, value, error };
});

let z = polar(6, 170 * radians);
let geometry;
let marks;
let pointerId = null;

function svgNode(tag, attributes, content) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  if (content !== undefined) element.textContent = content;
  return element;
}

function drawMap() {
  const width = svg.getBoundingClientRect().width;
  if (width === 0) return;
  const center = width / 2;
  const radius = center - 34;
  geometry = { width, center, radius };
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + width);
  svg.replaceChildren();

  function point(angle, distance) {
    const [x, y] = polar(distance, angle * radians);
    return [center + x, center - y];
  }

  function line([x1, y1], [x2, y2], stroke, strokeWidth = 1, dash) {
    const attributes = { x1, y1, x2, y2, stroke, 'stroke-width': strokeWidth };
    if (dash) attributes['stroke-dasharray'] = dash;
    return svgNode('line', attributes);
  }

  function label([x, y], content, fill, size = 11, extra = {}) {
    return svgNode('text', { x, y, fill, 'font-size': size, 'text-anchor': 'middle', ...extra }, content);
  }

  const origin = [center, center];
  const wedges = sectors.map((sector) => {
    const start = point(sector.start, radius);
    const end = point(sector.end, radius);
    const largeArc = sector.end - sector.start > 180 ? 1 : 0;
    const path = svgNode('path', {
      d: `M ${origin.join(' ')} L ${start.join(' ')} A ${radius} ${radius} 0 ${largeArc} 0 ${end.join(' ')} Z`,
      fill: sector.color,
      'fill-opacity': .075
    });
    svg.append(path);
    return path;
  });

  for (let r = 2; r <= maximumRadius; r += 2) {
    svg.append(svgNode('circle', {
      cx: center, cy: center, r: radius * r / maximumRadius,
      fill: 'none', stroke: r === maximumRadius ? '#665c54' : '#504945', 'stroke-opacity': .75
    }));
  }
  svg.append(line(point(270, radius), point(90, radius), '#665c54'));
  svg.append(line(origin, point(0, radius), '#665c54'));
  svg.append(line(origin, point(180, radius), '#928374', 1, '3 4'));
  for (const angle of [-120, 120]) {
    svg.append(line(origin, point(angle, radius), '#fabd2f', 1.45));
    svg.append(label(point(angle, radius + 17), angle < 0 ? '+240°' : angleText(angle), '#fabd2f'));
  }

  for (const sector of sectors) {
    const angle = (sector.start + sector.end) / 2;
    const position = point(angle, radius * .73);
    if (angle === 0) position[1] -= 14;
    svg.append(label(position, sector.id, sector.color, 13));
  }
  svg.append(label([5, center], '180°', '#bdae93', 11, { 'text-anchor': 'start' }));
  svg.append(label([center + 8, center - radius - 14], 'Im z', '#bdae93', 11, { 'text-anchor': 'start' }));
  svg.append(label([center + radius - 8, center + 12], 'Re z', '#bdae93', 11, { 'text-anchor': 'end' }));
  svg.append(svgNode('circle', { cx: center, cy: center, r: 2, fill: '#a89984' }));

  const guide = line(origin, origin, '#ebdbb2', 1, '2 4');
  guide.setAttribute('opacity', .6);
  const marker = svgNode('g', { 'pointer-events': 'none' });
  marker.append(
    svgNode('circle', { r: 9.5, fill: '#1d2021', 'fill-opacity': .8, stroke: '#ebdbb2', 'stroke-opacity': .46 }),
    svgNode('circle', { r: 4.5, fill: '#fabd2f', stroke: '#1d2021', 'stroke-width': 1 })
  );
  svg.append(guide, marker);
  marks = { wedges, guide, marker };
}

function update() {
  const [re, im] = z;
  const radius = Math.hypot(re, im);
  const angle = Math.atan2(im, re) / radians;
  const onCut = Math.abs(Math.abs(angle) - 180) < 1e-10;
  const onJump = Math.abs(Math.abs(angle) - 120) < 1e-10;
  const leftSector = angle > 0 ? 1 : 2;
  const sector = Math.abs(angle) > 120 ? leftSector : 0;
  let active = [sector];
  if (radius === 0) active = [];
  else if (onCut) active = [1, 2];
  else if (onJump) active = [0, leftSector];

  readouts['z-value'].textContent = '= ' + re.toFixed(2).replace('-', '−')
    + (im < 0 ? ' − ' : ' + ') + Math.abs(im).toFixed(2) + 'i';
  readouts.radius.textContent = '|z| ' + radius.toFixed(2);
  readouts.angle.textContent = radius === 0 ? 'arg z —' : 'arg z ' + angleText(angle, 1);
  if (radius === 0) {
    readouts.region.textContent = 'Turning point';
  } else if (onCut) {
    readouts.region.textContent = 'Branch cut';
  } else if (onJump) {
    readouts.region.textContent = 'Stokes jump';
  } else {
    readouts.region.textContent = 'Sector ' + sectors[sector].id;
  }

  const reference = airyReference(re, im);
  const referenceMagnitude = Math.hypot(...reference);
  complexText(readouts['ai-value'], reference, 8);
  for (const [i, row] of rows.entries()) {
    const current = active.includes(i);
    row.tr.classList.toggle('hp-current', current);
    if (current) row.tr.setAttribute('aria-current', 'location');
    else row.tr.removeAttribute('aria-current');
    if (radius === 0) {
      row.value.textContent = '—';
      row.error.textContent = '—';
      row.error.removeAttribute('title');
      continue;
    }
    // Use the principal branch, with the two lateral arguments on the cut.
    const argument = onCut ? (sectors[i].multiplier < 0 ? -180 : 180) : angle;
    const approximation = leadingApproximation(radius, argument, sectors[i].multiplier);
    if (onCut && sectors[i].multiplier !== 0) approximation[1] = 0;
    const difference = Math.hypot(approximation[0] - reference[0], approximation[1] - reference[1]);
    complexText(row.value, approximation, 6);
    row.error.textContent = magnitudeText(100 * difference / referenceMagnitude, 3) + '%';
    row.error.title = 'Absolute error ' + magnitudeText(difference, 6);
  }

  if (!geometry) return;
  const { center, radius: extent } = geometry;
  const x = center + (re / maximumRadius) * extent;
  const y = center - (im / maximumRadius) * extent;
  marks.marker.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  marks.guide.setAttribute('x2', x);
  marks.guide.setAttribute('y2', y);
  marks.wedges.forEach((wedge, i) => wedge.setAttribute('fill-opacity', active.includes(i) ? .19 : .075));
}

function selectPoint(re, im) {
  const radius = Math.hypot(re, im);
  const scale = radius > maximumRadius ? maximumRadius / radius : 1;
  z = [re * scale, im * scale];
  update();
}

function pointerPoint(event) {
  const { center, radius } = geometry;
  const bounds = svg.getBoundingClientRect();
  return [
    (event.clientX - bounds.left - center) * maximumRadius / radius,
    (center - event.clientY + bounds.top) * maximumRadius / radius
  ];
}

map.addEventListener('pointerdown', (event) => {
  if (!geometry || event.button !== 0 || pointerId !== null) return;
  const [re, im] = pointerPoint(event);
  if (Math.hypot(re, im) > maximumRadius + .7) return;
  pointerId = event.pointerId;
  map.setPointerCapture(pointerId);
  selectPoint(re, im);
});
map.addEventListener('pointermove', (event) => {
  if (event.pointerId === pointerId) selectPoint(...pointerPoint(event));
});
map.addEventListener('lostpointercapture', () => { pointerId = null; });
map.addEventListener('keydown', (event) => {
  if (event.key === 'Home') {
    event.preventDefault();
    selectPoint(0, 0);
    return;
  }
  const delta = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[event.key];
  if (!delta) return;
  event.preventDefault();
  const step = event.shiftKey ? .5 : .1;
  selectPoint(z[0] + step * delta[0], z[1] + step * delta[1]);
});

drawMap();
update();
new ResizeObserver(() => {
  drawMap();
  update();
}).observe(map);
})();
</script>
